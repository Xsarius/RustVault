[package]
name = "rustvault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RustVault domain logic — models, services, rule engine, i18n"

[lib]
name = "rustvault_core"
path = "src/lib.rs"

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
rust_decimal = { workspace = true }
validator = { workspace = true }

# Database (for derive macros and PgPool in services)
sqlx = { workspace = true }

# Internal crates
rustvault-db = { workspace = true }

# Auth
argon2 = "0.5"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
aes-gcm = "0.10"
rand = "0.10.0"
sha2 = "0.10"

# OIDC
openidconnect = "4"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

# Utilities
regex = "1"
hex = "0.4"
utoipa = { version = "5", features = ["uuid", "time", "decimal"] }

# i18n
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
toml = "0.9"
